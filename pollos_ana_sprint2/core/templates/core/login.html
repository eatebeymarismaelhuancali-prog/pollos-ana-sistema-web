<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Ingreso - POLLOS ANA</title></head><body class="bg-light d-flex align-items-center justify-content-center min-vh-100"><form method="post" class="card shadow-sm p-4" style="width:360px">{% csrf_token %}<h3 class="text-center mb-4">🐥 POLLOS ANA</h3>{% if form.errors %}<div class="alert alert-danger">Credenciales incorrectas</div>{% endif %}<label>Usuario</label><input name="username" class="form-control mb-3" required autofocus><label>Contraseña</label><input type="password" name="password" class="form-control mb-3" required><button class="btn btn-danger">Ingresar</button></form></body></html>
