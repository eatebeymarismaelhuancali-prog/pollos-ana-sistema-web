
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>LOGIN POLLOS ANA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff5d6;
        }

        .login-container {
            width: 100%;
            max-width: 1050px;
            min-height: 570px;
            display: grid;
            grid-template-columns: 40% 60%;
            border-radius: 24px;
            overflow: hidden;
            background: white;
            box-shadow: 0 20px 60px rgba(70, 50, 0, 0.15);
        }

        /* PANEL IZQUIERDO */
        .login-left {
            background: #ffffff;
            padding: 45px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-login {
            width: 300px;
            height: 125px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        .login-title {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            color: #262626;
            margin-bottom: 5px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-bottom: 32px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .form-control {
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 12px 18px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #f4c400;
            box-shadow: 0 0 0 3px rgba(244, 196, 0, 0.2);
        }

        .btn-login {
            background: #f5c518;
            border: none;
            border-radius: 30px;
            padding: 13px;
            font-weight: 800;
            color: #252525;
            width: 100%;
            transition: 0.25s;
        }

        .btn-login:hover {
            background: #e5b400;
            transform: translateY(-2px);
        }

        .login-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        /* PANEL DERECHO */
        .login-right {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px;
            background:
                radial-gradient(
                    ellipse at 80% 15%,
                    #fffbe5 0%,
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 20% 80%,
                    #e9a900 0%,
                    transparent 55%
                ),
                linear-gradient(
                    135deg,
                    #ffed96 0%,
                    #ffd337 45%,
                    #f2b900 100%
                );
        }

        .login-right::before {
            content: "";
            position: absolute;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            background: rgba(255,255,255,0.28);
            top: -200px;
            right: -120px;
            filter: blur(12px);
        }

        .login-right::after {
            content: "";
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            bottom: -220px;
            left: -100px;
            filter: blur(15px);
        }

        .welcome-content {
            position: relative;
            z-index: 2;
        }

        .welcome-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .welcome-title {
            font-size: clamp(36px, 5vw, 60px);
            font-weight: 800;
            color: #423000;
            margin-bottom: 15px;
        }

        .welcome-text {
            color: #624b00;
            font-size: 17px;
            max-width: 380px;
            margin: auto;
            line-height: 1.6;
        }

        .welcome-line {
            width: 80px;
            height: 5px;
            background: #ffffff;
            border-radius: 10px;
            margin: 25px auto;
        }

        /* ADAPTACIÓN PARA CELULARES */
        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 440px;
            }

            .login-left {
                padding: 35px 25px;
            }

            .login-right {
                min-height: 240px;
                padding: 30px;
            }

            .welcome-icon {
                font-size: 40px;
            }

            .welcome-title {
                font-size: 32px;
            }

            .welcome-text {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <!-- PANEL IZQUIERDO -->
        <section class="login-left">

            <img
                src="{% static 'core/img/logo.jpg' %}"
                alt="Logo de POLLOS ANA"
                class="logo-login"
            >
            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                <div class="alert alert-danger">
                    Usuario o contraseña incorrectos.
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Usuario
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    INGRESAR
                </button>
            </form>

            </div>

        </section>

        <!-- PANEL DERECHO -->
        <section class="login-right">
            <div class="welcome-content">
                <div class="welcome-icon"></div>

                <h2 class="welcome-title">
                    ¡Bienvenid@!
                </h2>

                <p class="welcome-text">
                    Controla tus ventas, productos y pedidos
                    de manera rápida, sencilla y organizada.
                </p>

                <div class="welcome-line"></div>

                </p>
            </div>
        </section>

    </main>

</body>
</html>
